<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.12);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 50%, #131d31 0%, var(--bg) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }

    .section {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    .section-header {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-align: center;
    }

    /* Grid Layout for Links */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    /* AI Agent / Links Cards */
    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      text-align: center;
      cursor: pointer;
    }

    .tile:hover {
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    /* Search Box Section */
    .search-wrapper {
      max-width: 720px;
      width: 100%;
      margin: 32px auto;
      text-align: center;
    }

    .search-input-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 18px 24px;
      padding-right: 50px;
      font-size: 1.15rem;
      background: rgba(15, 23, 42, 0.7);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      color: #fff;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 24px var(--accent-glow);
      background: rgba(15, 23, 42, 0.95);
    }

    .clear-btn {
      position: absolute;
      right: 18px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
      display: none;
    }

    /* Search Engine Buttons */
    .engine-btn {
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .engine-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- UPPER HALF: AI AGENTS & PROVIDERS -->
  <div class="section">
    <div class="section-header">Search</div>
    <div class="grid">
      <a class="tile" href="https://chatgpt.com" target="_blank">ChatGPT</a>
      <a class="tile" href="https://gemini.google.com" target="_blank">Google Gemini</a>
      <a class="tile" href="https://claude.ai" target="_blank">Anthropic Claude</a>
      <a class="tile" href="https://chat.deepseek.com" target="_blank">DeepSeek</a>
      <a class="tile" href="https://z.ai" target="_blank">Z.AI (Zhipu)</a>
      <a class="tile" href="https://chat.mistral.ai" target="_blank">Mistral (Le Chat)</a>
      <a class="tile" href="https://chat.qwen.ai" target="_blank">Alibaba Qwen</a>
      <a class="tile" href="https://kimi.moonshot.cn" target="_blank">Moonshot Kimi</a>
      <a class="tile" href="https://www.meta.ai" target="_blank">Meta AI</a>
      <a class="tile" href="https://x.ai" target="_blank">xAI (Grok)</a>
      <a class="tile" href="https://www.perplexity.ai" target="_blank">Perplexity</a>
      <a class="tile" href="https://cohere.com" target="_blank">Cohere</a>
      <a class="tile" href="https://tii.ae" target="_blank">TII (Falcon)</a>
      <a class="tile" href="https://huggingface.co/chat" target="_blank">HuggingChat</a>
    </div>
  </div>

  <!-- MIDDLE: UNIVERSAL SEARCH BOX -->
  <div class="search-wrapper">
    <div class="search-input-container">
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Type here to search..."
        autocomplete="off"
        autofocus
      />
      <button class="clear-btn" id="clear-btn" title="Clear">✕</button>
    </div>
    <div class="hint">Type your query, then click any search engine below (or press Enter for Google)</div>
  </div>

  <!-- BOTTOM HALF: SEARCH ENGINES -->
  <div class="section">
    <div class="section-header">Search Engines</div>
    <div class="grid" id="engine-grid">
      <button class="engine-btn" data-url="https://www.google.com/search?q=" data-home="https://www.google.com">Google</button>
      <button class="engine-btn" data-url="https://www.bing.com/search?q=" data-home="https://www.bing.com">Bing</button>
      <button class="engine-btn" data-url="https://duckduckgo.com/?q=" data-home="https://duckduckgo.com">DuckDuckGo</button>
      <button class="engine-btn" data-url="https://search.brave.com/search?q=" data-home="https://search.brave.com">Brave</button>
      <button class="engine-btn" data-url="https://www.perplexity.ai/search?q=" data-home="https://www.perplexity.ai">Perplexity</button>
      <button class="engine-btn" data-url="https://search.yahoo.com/search?p=" data-home="https://search.yahoo.com">Yahoo</button>
      <button class="engine-btn" data-url="https://www.ecosia.org/search?q=" data-home="https://www.ecosia.org">Ecosia</button>
      <button class="engine-btn" data-url="https://kagi.com/search?q=" data-home="https://kagi.com">Kagi</button>
      <button class="engine-btn" data-url="https://yandex.com/search/?text=" data-home="https://yandex.com">Yandex</button>
      <button class="engine-btn" data-url="https://www.baidu.com/s?wd=" data-home="https://www.baidu.com">Baidu</button>
      <button class="engine-btn" data-url="https://www.startpage.com/sp/search?query=" data-home="https://www.startpage.com">Startpage</button>
      <button class="engine-btn" data-url="https://search.naver.com/search.naver?query=" data-home="https://www.naver.com">Naver</button>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-btn');
    const engineButtons = document.querySelectorAll('.engine-btn');

    // Show/hide clear button
    searchInput.addEventListener('input', () => {
      clearBtn.style.display = searchInput.value.length > 0 ? 'block' : 'none';
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.style.display = 'none';
      searchInput.focus();
    });

    // Execute search for an engine
    function runSearch(button) {
      const query = searchInput.value.trim();
      const searchUrl = button.getAttribute('data-url');
      const homeUrl = button.getAttribute('data-home');

      if (query) {
        window.open(searchUrl + encodeURIComponent(query), '_blank');
      } else {
        // If query is empty, simply visit that engine's homepage
        window.open(homeUrl, '_blank');
      }
    }

    // Attach click events to all engine buttons
    engineButtons.forEach((btn) => {
      btn.addEventListener('click', () => runSearch(btn));
    });

    // Press Enter to search on Google by default
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const defaultEngine = document.querySelector('.engine-btn'); // Google (first button)
        runSearch(defaultEngine);
      }
    });
  </script>
</body>
</html>
